name: Automotive Sales Engine Tests
on:
  push:
    branches: [automotive-sales-engine]
    paths:
      - 'automotive-sales-engine/**'
      - '.github/workflows/automotive-decision-tests.yml'
  workflow_dispatch:
jobs:
  sales-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and test dependencies
        working-directory: automotive-sales-engine
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'httpx>=0.27,<1'
      - name: Run inventory and decision regression suite
        working-directory: automotive-sales-engine
        run: python -m unittest -v test_inventory_registry.py test_decision_intelligence.py test_deal_execution.py
